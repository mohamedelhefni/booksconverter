<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval' https://analytics.hefni101.dev; connect-src 'self' blob: data: https://analytics.hefni101.dev; style-src 'self' 'unsafe-inline' blob:">
<title class="siraaj-mask">Shelf</title>
<meta name="description" content="A lightweight ebook library, converter and reader. EPUB, KFX, AZW3, MOBI. Runs offline, books never leave your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f6f2eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f2eb; --surface: #fffdf8; --ink: #24201b; --muted: #6e665b; --line: #e4ddd1;
  --accent: #8c3a26; --accent-ink: #fff; --danger: #a12a1f; --shadow: 0 1px 2px #0000000f, 0 4px 14px #00000012;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171513; --surface: #211e1b; --ink: #ece5da; --muted: #a59c8f; --line: #35302a;
    --accent: #e3906f; --accent-ink: #1b1410; --danger: #f08a7c; --shadow: 0 1px 2px #0006, 0 4px 14px #0005; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
button, select { cursor: pointer; }
.btn, select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .5em .9em; }
.btn:hover, select:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .55; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center;
  padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; margin-inline-end: 8px; font: 600 22px/1 var(--serif); }
.top input[type=search] { flex: 1; min-width: 0; max-width: 420px; padding: .5em .8em; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); }
.top .spacer { flex: 1; }
@media (max-width: 520px) { body > .top { flex-wrap: wrap; } body > .top input[type=search] { order: 3; flex-basis: 100%; max-width: none; } }
#status { margin: 0; padding: 0 16px; min-height: 0; color: var(--muted); font-size: 13px; }
#status:not(:empty) { padding-top: 10px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 22px 18px; padding: 18px 16px 48px; }
.card { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.cover { display: block; aspect-ratio: 2 / 3; width: 100%; border-radius: 4px; object-fit: cover; box-shadow: var(--shadow);
  background: var(--surface); transition: transform .15s; }
.card:hover .cover { transform: translateY(-2px); }
.placeholder { display: flex; align-items: flex-end; padding: 12px; color: #fffbf3; font: 600 15px/1.2 var(--serif);
  overflow: hidden; word-break: break-word; }
.card .t { margin-top: 6px; font-weight: 600; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.card .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { align-self: flex-start; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

.empty { margin: 8vh auto; max-width: 440px; padding: 40px 24px; text-align: center; border: 2px dashed var(--line); border-radius: 14px; }
.empty h2 { font: 600 24px/1.2 var(--serif); margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0 0 20px; }
body.dragging::after { content: attr(data-drop); position: fixed; inset: 10px; z-index: 9; display: grid; place-items: center;
  border: 3px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--bg) 85%, transparent);
  font: 600 22px var(--serif); pointer-events: none; }

dialog { width: min(640px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); border: 1px solid var(--line); border-radius: 14px;
  padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px #0004; }
dialog::backdrop { background: #0006; }
.d-body { display: grid; grid-template-columns: 160px 1fr; gap: 22px; padding: 24px; }
.d-body h2 { margin: 0 0 4px; margin-inline-end: 32px; font: 600 22px/1.2 var(--serif); }
.d-body p { margin: 0 0 4px; }
.muted { color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.actions label { display: flex; gap: 8px; align-items: center; }
.close { position: absolute; top: 10px; inset-inline-end: 10px; margin: 0; }
.close button { border: 0; background: none; font-size: 24px; line-height: 1; padding: 6px 10px; color: var(--muted); }
@media (max-width: 520px) { .d-body { grid-template-columns: 1fr; } .d-body #d-cover { width: 120px; } }

#reader { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; background: var(--rbg); }
#reader .top, #reader .bottom { background: var(--rbg); color: var(--rfg); border-color: color-mix(in srgb, var(--rfg) 14%, transparent); }
#reader .btn, #reader select { background: transparent; color: var(--rfg); border-color: color-mix(in srgb, var(--rfg) 20%, transparent); }
#reader .top { gap: 8px; }
#r-toc { flex: 1; min-width: 0; max-width: 460px; text-overflow: ellipsis; }
/* Page-turn chevrons point outward, following the book's direction (the footer's dir).
   Flex order puts them on the right side; LTR isolation stops bidi mirroring from flipping the glyph. */
#r-prev, #r-next { display: inline-flex; align-items: center; gap: .35em; }
.chev { direction: ltr; unicode-bidi: isolate; }
#r-prev .chev::before, #r-bottom[dir=rtl] #r-next .chev::before { content: "‹"; }
#r-next .chev::before, #r-bottom[dir=rtl] #r-prev .chev::before { content: "›"; }
:root[dir=rtl] #r-back { transform: scaleX(-1); }
#r-frame { flex: 1; width: 100%; border: 0; background: var(--rbg); }
.bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 16px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid; font-size: 13px; }
.progress { flex: 1; max-width: 360px; height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--rfg) 15%, transparent); }
.progress i { display: block; height: 100%; border-radius: 3px; background: var(--accent); width: 0; }
@media (max-width: 520px) { #reader .top .hide-sm { display: none; } }
footer.credit { padding: 0 16px 24px; color: var(--muted); font-size: 12px; text-align: center; }
footer.credit a { color: inherit; }
</style>
</head>
<body>
<header class="top">
  <h1>Shelf</h1>
  <input type="search" id="q" dir="auto" placeholder="Search title or author" aria-label="Search library" hidden>
  <span class="spacer"></span>
  <button class="btn" id="lang"></button>
  <button class="btn primary" id="add">Add books</button>
  <input type="file" id="pick" multiple accept=".epub,.azw3,.azw,.mobi,.kfx" hidden>
</header>
<p id="status" class="siraaj-mask" role="status" aria-live="polite"></p>

<section class="empty" id="empty" hidden>
  <h2>Your library is empty</h2>
  <p>Drop EPUB, KFX, AZW3 or MOBI files anywhere on this page. Books are stored on this device and never uploaded.</p>
  <button class="btn primary" id="add2">Add books</button>
</section>
<main class="grid siraaj-mask" id="grid" aria-label="Library"></main>
<footer class="credit">Conversion by <a href="https://github.com/zacharydenton/boko" target="_blank" rel="noopener">boko</a>, running locally in WebAssembly.</footer>

<dialog id="details" aria-labelledby="d-title">
  <form method="dialog" class="close"><button aria-label="Close">×</button></form>
  <div class="d-body">
    <div id="d-cover" class="siraaj-mask"></div>
    <div>
      <h2 id="d-title" class="siraaj-mask" dir="auto"></h2>
      <p id="d-authors" class="siraaj-mask" dir="auto"></p>
      <p id="d-meta" class="muted siraaj-mask"></p>
      <div class="actions">
        <button class="btn primary" id="d-read">Read</button>
        <button class="btn" id="d-original">Download original</button>
      </div>
      <div class="actions">
        <label>Convert to <select id="d-format"></select></label>
        <button class="btn" id="d-convert">Convert &amp; download</button>
      </div>
      <p id="d-msg" class="muted siraaj-mask" role="status" aria-live="polite"></p>
      <div class="actions"><button class="btn danger" id="d-delete">Remove from library</button></div>
    </div>
  </div>
</dialog>

<section id="reader" hidden aria-label="Reader">
  <header class="top">
    <button class="btn" id="r-back" aria-label="Back to library">←</button>
    <select id="r-toc" class="siraaj-mask" aria-label="Table of contents"></select>
    <button class="btn" id="r-smaller" dir="ltr" aria-label="Smaller text">A−</button>
    <button class="btn" id="r-bigger" dir="ltr" aria-label="Larger text">A+</button>
    <select id="r-theme" aria-label="Reading theme" class="hide-sm">
      <option value="auto">Auto</option><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option>
    </select>
  </header>
  <iframe id="r-frame" class="siraaj-block" title="Book content" sandbox="allow-same-origin allow-scripts"></iframe>
  <footer class="bottom" id="r-bottom">
    <button class="btn" id="r-prev" aria-label="Previous chapter"><span class="chev" aria-hidden="true"></span>Prev</button>
    <span id="r-pos" dir="auto"></span>
    <div class="progress" aria-hidden="true"><i id="r-bar"></i></div>
    <button class="btn" id="r-next" aria-label="Next chapter">Next<span class="chev" aria-hidden="true"></span></button>
  </footer>
</section>
<script type="module" src="app.js"></script>
</body>
</html>
